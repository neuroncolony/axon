<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{BRAND}} · Offspring</title><meta name="description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="static/styles.css"><script src="static/shell.js" defer></script>
<style>.lineage{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}.lineage .arrow{color:var(--faint);font-size:20px}.node{display:flex;gap:10px;align-items:center;min-width:0}.node .logo{width:40px;height:40px;border-radius:14px;background:var(--blue-soft);box-shadow:0 0 0 1px var(--line);object-fit:cover;flex:none}.node .n{font-family:var(--head);font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node .s{font-family:var(--mono);font-size:12px;color:var(--muted)}@media(max-width:560px){.lineage{grid-template-columns:1fr;gap:6px}.lineage .arrow{transform:rotate(90deg);justify-self:center}}</style></head>
<body style="background:url(assets/sky-bg.mp4) fixed center/cover"><header class="nav" id="nav"></header>
<main class="page"><div class="wrap">
<div class="section-head"><div><div class="eyebrow">Lineage</div><h2>Offspring</h2></div><a href="leaderboard">Leaderboards →</a></div>
<p class="muted" style="margin:0 0 1rem;max-width:44rem">An offspring is a token launched by a wallet that had already launched one here. The first launch is the parent. Lineage is derived from chain order, not declared, so it cannot be faked or hidden.</p>
<div class="grid c2" id="grid"><p class="faint">Reading…</p></div>
</div></main><footer class="footer" id="footer"></footer>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { api, esc, fmtUsd, ago, short, href } = AXON; const usd = v => v == null ? 'n/a' : fmtUsd(v);
  const LOGO = t => AXON.href(t.logoUrl || ('/api/token/' + t.token + '/logo'));
  const logoImg = t => `<img class="logo" src="${esc(LOGO(t))}" alt="" loading="lazy" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${esc(AXON.href('/api/token/' + t.token + '/logo'))}'}">`;
  const node = t => `<a class="node" href="${href('/token/' + t.token)}">${logoImg(t)}<span><span class="n">${esc(t.name || short(t.token))}</span><br><span class="s">$${esc(t.symbol || '?')} · ${esc(t.modelName || 'no model')} · ${usd(t.marketCapUsd)} · ${ago(t.launchedAt)}</span></span></a>`;
  const g = document.getElementById('grid');
  try { const { offspring } = await api('offspring');
    g.innerHTML = offspring.length ? offspring.map(o => `<div class="card"><div class="eyebrow" style="margin-bottom:10px">${short(o.child.deployer)} · <a href="${AXON.CHAIN.explorer}/address/${o.child.deployer}" target="_blank" rel="noopener">wallet ↗</a></div><div class="lineage">${node(o.parent)}<span class="arrow">→</span>${node(o.child)}</div></div>`).join('') : '<div class="empty" style="grid-column:1/-1">No offspring yet. It takes a wallet launching twice.</div>';
  } catch (e) { g.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
});
</script></body></html>
